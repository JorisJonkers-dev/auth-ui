# Deploy Preview for deploy-platform service repos.
#
# Any PR touching deploy/ gets a full render + validation and a sticky
# "Deploy Preview" comment with the SC-11 readiness scorecard. The reusable
# deploy-validate.yml workflow owns the gate-summary emission and the comment.
name: Deploy Preview

on:
  pull_request:
    paths:
      - 'platform/**'

permissions: {}

jobs:
  deploy-preview:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-validate.yml@f6c2969d7f1f4555da3b2cf46ce6a9b364c471b3 # v0.12.0
    with:
      deploy-dir: platform
      schema-version: 0.20.0
      image-lock-path: platform/images.lock.json
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:9479bc22ae11183c0b68f257d2c1a21455be8c3cff602d3a491ea3ff31d01fe3
      environments: production
      comment: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
