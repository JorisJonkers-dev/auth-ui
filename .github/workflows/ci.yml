name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download actionlint
        id: actionlint
        shell: bash
        run: 'bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)'

      - name: Lint GitHub Actions workflows
        shell: bash
        run: '${{ steps.actionlint.outputs.executable }} -color .github/workflows/*.yml'

  web-check:
    name: Web Check
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@v0.14.1
    with:
      package-manager: pnpm
      install-command: pnpm install --no-frozen-lockfile
      typecheck-command: pnpm typecheck
      test-command: pnpm test:coverage
      build-command: pnpm build
      package-check-command: pnpm depcruise
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'

  e2e:
    name: E2E
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@v0.14.1
    with:
      package-manager: pnpm
      install-command: pnpm install --no-frozen-lockfile
      typecheck-command: pnpm typecheck
      test-command: pnpm exec playwright install --with-deps && pnpm test:e2e
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'

  mutation:
    name: Mutation
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@v0.14.1
    with:
      package-manager: pnpm
      install-command: pnpm install --no-frozen-lockfile
      typecheck-command: pnpm typecheck
      test-command: pnpm stryker
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: 'ghcr.io/jorisjonkers-dev/auth-ui:ci-${{ github.sha }}'
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - web-check
      - e2e
      - mutation
      - docker-build
    if: '${{ always() }}'
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@release/v1
        with:
          jobs: '${{ toJSON(needs) }}'
