name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download actionlint
        id: actionlint
        shell: bash
        run: 'bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)'

      - name: Lint GitHub Actions workflows
        shell: bash
        run: '${{ steps.actionlint.outputs.executable }} -color .github/workflows/*.yml'

  web-check:
    name: Web Check
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@583993e5865cd5b8761fe52db5843130fb107c51 # v0.34.2
    with:
      package-manager: pnpm
      install-command: pnpm install --no-frozen-lockfile
      typecheck-command: pnpm typecheck
      test-command: pnpm test:coverage
      build-command: pnpm build
      package-check-command: pnpm depcruise
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'

  e2e:
    name: E2E
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@583993e5865cd5b8761fe52db5843130fb107c51 # v0.34.2
    with:
      package-manager: pnpm
      install-command: pnpm install --no-frozen-lockfile
      typecheck-command: pnpm typecheck
      test-command: pnpm exec playwright install --with-deps && pnpm test:e2e
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'

  mutation:
    name: Mutation
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@583993e5865cd5b8761fe52db5843130fb107c51 # v0.34.2
    with:
      package-manager: pnpm
      install-command: pnpm install --no-frozen-lockfile
      typecheck-command: pnpm typecheck
      test-command: pnpm stryker
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: 'ghcr.io/jorisjonkers-dev/auth-ui:ci-${{ github.sha }}'
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - workflow-lint
      - web-check
      - e2e
      - mutation
      - docker-build
    if: '${{ always() }}'
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: '${{ toJSON(needs) }}'
