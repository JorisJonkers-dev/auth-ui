name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download actionlint
        id: actionlint
        shell: bash
        run: 'bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)'

      - name: Lint GitHub Actions workflows
        shell: bash
        run: '${{ steps.actionlint.outputs.executable }} -color .github/workflows/*.yml'

  web-check:
    name: Web Check
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@f2180a482b63756affde537233881fa12e65df70 # v0.35.0
    with:
      package-manager: pnpm
      install-command: pnpm install --no-frozen-lockfile
      typecheck-command: pnpm typecheck
      test-command: pnpm test:coverage
      build-command: pnpm build
      package-check-command: pnpm depcruise
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'

  # The Playwright version the lockfile resolves, so the container below always carries the
  # browsers that version expects, also after Renovate bumps @playwright/test.
  e2e-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: '${{ steps.read.outputs.version }}'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: read
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 -E "^  '@playwright/test@[0-9]" pnpm-lock.yaml | sed -E "s/^  '@playwright\/test@([0-9][^']*)':.*/\1/")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no @playwright/test version in pnpm-lock.yaml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One job per browser. The whole suite runs in under a minute, so a browser needs no further
  # sharding. The official Playwright image already holds the browsers and every system package
  # they need, so no job waits on apt mirrors.
  e2e:
    name: 'E2E (${{ matrix.browser }})'
    needs: e2e-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: 'mcr.microsoft.com/playwright:v${{ needs.e2e-version.outputs.version }}-noble'
      options: --ipc=host
    env:
      # Firefox refuses a HOME the container's root user does not own.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --no-frozen-lockfile

      - name: Run E2E
        run: 'pnpm test:e2e --project=${{ matrix.browser }}'

      - name: Keep the browser's report
        if: '${{ !cancelled() }}'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'blob-report-${{ matrix.browser }}'
          path: blob-report
          retention-days: 7

  # One HTML report from every browser, for reading a failure; not part of Pipeline Complete.
  e2e-report:
    name: Playwright report
    if: '${{ !cancelled() }}'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --no-frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  mutation:
    name: Mutation
    uses: JorisJonkers-dev/github-workflows/.github/workflows/node-ci.yml@f2180a482b63756affde537233881fa12e65df70 # v0.35.0
    with:
      package-manager: pnpm
      install-command: pnpm install --no-frozen-lockfile
      typecheck-command: pnpm typecheck
      test-command: pnpm stryker
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: 'ghcr.io/jorisjonkers-dev/auth-ui:ci-${{ github.sha }}'
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - workflow-lint
      - web-check
      - e2e-version
      - e2e
      - mutation
      - docker-build
    if: '${{ always() }}'
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: '${{ toJSON(needs) }}'
