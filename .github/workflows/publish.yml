# Tag-triggered publish flow.
#
# push of a v*.*.* tag (authored by release.yml via the App token) publishes
# the image. auth-api's own publish locks this image into the `auth`
# fragment, so nothing here publishes a deploy artifact.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  # -- 1. Build and push the container image --------------------------------
  # Reusable workflow: consume its results via needs.<job>.outputs downstream;
  # a `uses:` job must not redeclare an outputs: block.
  publish-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@281c848691bd87e83c3b9a185103270637355825 # v0.42.0
    with:
      # Restored: adopting the shared publish flow dropped the inline
      # build-push-action's platforms value, so this fell back to the
      # workflow's linux/amd64 default and the arm64 nodes could not pull.
      platforms: linux/amd64,linux/arm64
      image-name: auth-ui
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
