# Tag-triggered publish flow for deploy-platform service repos.
#
# push of a v*.*.* tag (authored by release.yml via the App token) drives:
#   publish-image -> resolve-image-lock -> publish-deploy-artifact -> register-service
#
# Boundary rule (R1-2): the image lock crosses the reusable-workflow boundary
# as an UPLOADED ARTIFACT (image-lock-artifact), never as a runner-local path.
# deploy-artifact.yml downloads the artifact itself; there is no intermediate
# download job and no image-lock-path input on the deploy-artifact call.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  # -- 1. Build and push the container image --------------------------------
  # Reusable workflow: consume its results via needs.<job>.outputs downstream;
  # a `uses:` job must not redeclare an outputs: block.
  publish-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@f6c2969d7f1f4555da3b2cf46ce6a9b364c471b3 # v0.12.0
    with:
      # Restored: adopting the shared publish flow dropped the inline
      # build-push-action's platforms value, so this fell back to the
      # workflow's linux/amd64 default and the arm64 nodes could not pull.
      platforms: linux/amd64,linux/arm64
      image-name: auth-ui
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

  # -- 2. Resolve the image lock (upload artifact, never path) --------------
  resolve-image-lock:
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      images-lock-artifact: images-lock-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: resolve-image-digest
        id: digest
        # container-publish.yml does not expose a digest output; resolve the
        # digest of the tag it just pushed from the registry.
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/auth-ui
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "E_FLOATING_IMAGE: could not resolve a digest for ${IMAGE}:${TAG}" >&2
            exit 1
          fi
          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"

      - name: lock-image
        # deploy-config-schema@0.16.0 has no top-level 'images' subcommand.
        # Write the object-form images.lock.json directly; the schema CLI and
        # deploy-artifact action consume it as a plain JSON file.
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.image-digest }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "null" ]; then
            echo "E_FLOATING_IMAGE: IMAGE_DIGEST is empty" >&2
            exit 1
          fi
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "E_FLOATING_IMAGE: IMAGE_DIGEST is not a digest ref (got: $IMAGE_DIGEST)" >&2; exit 1 ;;
          esac
          printf '{"auth-ui":"ghcr.io/jorisjonkers-dev/auth-ui@%s"}\n' "$IMAGE_DIGEST" \
            > platform/images.lock.json
          echo "Locked image: ghcr.io/jorisjonkers-dev/auth-ui@${IMAGE_DIGEST}"

      - name: verify-lock
        # Guard: confirm images.lock.json is well-formed and digest-pinned.
        run: |
          set -euo pipefail
          lock_ref=$(jq -r '.["auth-ui"]' platform/images.lock.json)
          case "$lock_ref" in
            *@sha256:*) echo "Digest pin verified: $lock_ref" ;;
            *) echo "E_FLOATING_IMAGE: lock ref is not digest-pinned: $lock_ref" >&2; exit 1 ;;
          esac

      - name: upload-image-lock
        uses: actions/upload-artifact@v5
        with:
          name: images-lock-${{ github.run_id }}
          path: platform/images.lock.json
          retention-days: 1

  # -- 3. Render and publish the deploy artifact ----------------------------
  # The reusable workflow downloads the image-lock artifact itself;
  # image-lock-artifact is the ONLY lock input passed across the boundary.
  publish-deploy-artifact:
    needs: [resolve-image-lock]
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-artifact.yml@ea7a9a1c52870c2ae3db08cd077d54dbef48aa3d # v0.14.0
    with:
      ref: ${{ github.ref }}
      artifact-name: auth-ui
      artifact-version: ${{ github.ref_name }}
      schema-version: 0.20.0
      apply-bundle: true
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:9479bc22ae11183c0b68f257d2c1a21455be8c3cff602d3a491ea3ff31d01fe3
      deploy-dir: platform
      image-lock-artifact: ${{ needs.resolve-image-lock.outputs.images-lock-artifact }}
      environments: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
